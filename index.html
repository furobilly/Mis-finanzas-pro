<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>🔐 Finanzas Pro V2.5 - Toño</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #20A39E;      /* Verde Agua */
            --warning: #FFBA49;      /* Dorado */
            --danger: #EF5B5B;       /* Coral */
            --text-dark: #23001E;    /* Violeta */
            --bg-light: #F6F7FB;
            --surface: #FFFFFF;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); margin: 0; padding-bottom: 50px; }

        /* PANTALLA DE BLOQUEO (PIN) */
        #pin-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: 0.5s;
        }
        .pin-input {
            font-size: 2rem; text-align: center; width: 150px; border: none;
            border-radius: 10px; padding: 10px; margin-top: 20px; letter-spacing: 10px;
        }

        /* HEADER & NAV */
        header { background: var(--primary); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 99; }
        nav { background: var(--surface); display: flex; overflow-x: auto; padding: 10px; gap: 10px; border-bottom: 1px solid #ddd; }
        .tab-btn { padding: 8px 15px; border: none; background: none; border-radius: 15px; cursor: pointer; white-space: nowrap; color: #888; font-weight: 600; }
        .tab-btn.active { background: var(--primary); color: white; }

        /* DASHBOARD VISUALS */
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .grid-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .tile { background: var(--surface); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tile-value { font-size: 1.4rem; font-weight: 800; margin-top: 5px; }

        /* BADGES (ESTADOS) */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-pending { background: #ffebeb; color: var(--danger); }
        .badge-paid { background: #e0f7f6; color: var(--primary); }

        /* PROGRESS BAR */
        .progress-container { background: #eee; border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; transition: 0.5s; }

        /* FORMS */
        .card { background: var(--surface); border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; }
        input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .btn-add { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="pin-screen">
    <h2 id="pin-msg">🔒 Introduce tu PIN</h2>
    <input type="password" id="pin-entry" class="pin-input" maxlength="4" inputmode="numeric">
    <p id="pin-hint" style="margin-top: 10px; font-size: 0.8rem;"></p>
</div>

<div id="app-content" class="hidden">
    <header>
        <div class="brand">📊 Finanzas Pro <span style="font-size: 0.7rem;">V2.5</span></div>
        <select id="monthSel" style="width: auto;"></select>
    </header>

    <nav>
        <button class="tab-btn active" data-target="dashboard">📊 Resumen</button>
        <button class="tab-btn" data-target="servicios">🏠 Fijos/Digital</button>
        <button class="tab-btn" data-target="gastos">🛒 Hormiga/Var</button>
        <button class="tab-btn" data-target="tarjetas">💳 Mis Tarjetas</button>
        <button class="tab-btn" data-target="ahorros">💜 Ahorro</button>
    </nav>

    <div class="container">
        <section id="dashboard" class="page active">
            <div class="grid-summary">
                <div class="tile">
                    <div style="font-size: 0.8rem; color: #888;">BALANCE DEL MES</div>
                    <div id="dash-bal" class="tile-value">$0.00</div>
                    <div class="progress-container"><div id="progress-bar" class="progress-bar" style="width: 0%"></div></div>
                    <div id="progress-text" style="font-size: 0.7rem; color: #888;">0% de pagos completados</div>
                </div>
                <div class="tile"><div style="font-size: 0.8rem; color: #888;">AHORRO ACUMULADO</div><div id="dash-sav" class="tile-value">$0.00</div></div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h3>📅 Pagos de la Quincena</h3>
                <div id="q-list"></div>
            </div>
        </section>

        <section id="servicios" class="page hidden">
            <div class="card">
                <h3>🏠 Servicios y Suscripciones Digitales</h3>
                <div class="form-row">
                    <input type="text" id="serv-name" placeholder="Nombre (Netflix, Renta...)">
                    <input type="number" id="serv-amt" placeholder="Monto">
                    <input type="number" id="serv-day" placeholder="Día pago" min="1" max="31">
                    <select id="serv-card"></select>
                    <button class="btn-add" onclick="addItem('services')">Añadir</button>
                </div>
                <div id="services-list"></div>
            </div>
        </section>

        <section id="gastos" class="page hidden">
            <div class="card">
                <h3>🛒 Gastos Hormiga y Variables</h3>
                <div class="form-row">
                    <input type="text" id="exp-desc" placeholder="¿Qué compraste?">
                    <input type="number" id="exp-amt" placeholder="Monto">
                    <select id="exp-card"></select>
                    <button class="btn-add" onclick="addItem('expenses')">Registrar</button>
                </div>
                <div id="expenses-list"></div>
            </div>
        </section>

        <section id="tarjetas" class="page hidden">
            <div class="card">
                <h3>💳 Mis Tarjetas</h3>
                <div class="form-row">
                    <input type="text" id="card-name" placeholder="Nombre (BBVA, AMEX)">
                    <input type="text" id="card-digits" placeholder="Últimos 4 dígitos" maxlength="4">
                    <button class="btn-add" onclick="addItem('cards')">Guardar Tarjeta</button>
                </div>
                <div id="cards-list"></div>
            </div>
        </section>

        <section id="ahorros" class="page hidden">
            <div class="card">
                <h3>💜 Mi Cochinito (Ahorro Real)</h3>
                <div class="form-row">
                    <input type="number" id="sav-amt" placeholder="Monto">
                    <select id="sav-type"><option value="in">➕ Depósito</option><option value="out">➖ Retiro</option></select>
                    <button class="btn-add" onclick="addItem('savings')">Actualizar</button>
                </div>
                <div id="savings-history"></div>
            </div>
        </section>
    </div>
</div>

<script>
    // --- MODELO DE DATOS ---
    let db = JSON.parse(localStorage.getItem('finanzasProV25')) || {
        pin: null,
        cards: [],
        months: {},
        globalSavings: 0
    };

    let currentM = new Date().getMonth();
    const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });

    // --- SEGURIDAD (PIN) ---
    const pinEntry = document.getElementById('pin-entry');
    if (!db.pin) {
        document.getElementById('pin-msg').innerText = "🆕 Crea tu PIN de 4 dígitos";
        document.getElementById('pin-hint').innerText = "Este PIN protegerá tus datos en este navegador.";
    }

    pinEntry.addEventListener('input', (e) => {
        if (e.target.value.length === 4) {
            if (!db.pin) {
                db.pin = e.target.value;
                save();
                unlock();
            } else if (e.target.value === db.pin) {
                unlock();
            } else {
                alert("PIN Incorrecto");
                e.target.value = "";
            }
        }
    });

    function unlock() {
        document.getElementById('pin-screen').style.transform = "translateY(-100%)";
        document.getElementById('app-content').classList.remove('hidden');
        init();
    }

    // --- LÓGICA CORE ---
    function init() {
        const mSel = document.getElementById('monthSel');
        ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"].forEach((m, i) => {
            mSel.innerHTML += `<option value="${i}" ${i === currentM ? 'selected' : ''}>${m}</option>`;
        });
        mSel.onchange = (e) => { currentM = parseInt(e.target.value); render(); };
        setupTabs();
        render();
    }

    function setupTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
                document.getElementById(btn.dataset.target).classList.remove('hidden');
            };
        });
    }

    function getMonthData() {
        if (!db.months[currentM]) db.months[currentM] = { services: [], expenses: [], payments: {} };
        return db.months[currentM];
    }

    function addItem(type) {
        const data = getMonthData();
        if (type === 'cards') {
            const name = document.getElementById('card-name').value;
            const digits = document.getElementById('card-digits').value;
            if (name && digits) db.cards.push({ name, digits, id: Date.now() });
        } else if (type === 'services') {
            const name = document.getElementById('serv-name').value;
            const amt = parseFloat(document.getElementById('serv-amt').value);
            const day = parseInt(document.getElementById('serv-day').value);
            const card = document.getElementById('serv-card').value;
            if (name && amt) data.services.push({ name, amt, day, card, id: Date.now() });
        } else if (type === 'expenses') {
            const desc = document.getElementById('exp-desc').value;
            const amt = parseFloat(document.getElementById('exp-amt').value);
            const card = document.getElementById('exp-card').value;
            if (desc && amt) data.expenses.push({ desc, amt, card, id: Date.now() });
        } else if (type === 'savings') {
            const amt = parseFloat(document.getElementById('sav-amt').value);
            const op = document.getElementById('sav-type').value;
            db.globalSavings += (op === 'in' ? amt : -amt);
        }
        save(); render();
    }

    function togglePayment(id) {
        const data = getMonthData();
        data.payments[id] = !data.payments[id];
        save(); render();
    }

    function save() { localStorage.setItem('finanzasProV25', JSON.stringify(db)); }

    function render() {
        const data = getMonthData();
        // Cargar dropdowns de tarjetas
        const cardSelectors = ['serv-card', 'exp-card'];
        cardSelectors.forEach(sId => {
            const s = document.getElementById(sId);
            s.innerHTML = '<option value="efectivo">💵 Efectivo</option>';
            db.cards.forEach(c => s.innerHTML += `<option value="${c.digits}">💳 ${c.name} (*${c.digits})</option>`);
        });

        // Dashboard
        const totalServ = data.services.reduce((acc, s) => acc + s.amt, 0);
        const totalExp = data.expenses.reduce((acc, e) => acc + e.amt, 0);
        document.getElementById('dash-bal').innerText = fmt.format(totalServ + totalExp);
        document.getElementById('dash-sav').innerText = fmt.format(db.globalSavings);

        // Barra progreso quincena
        const totalItems = data.services.length;
        const paidItems = data.services.filter(s => data.payments[s.id]).length;
        const percent = totalItems === 0 ? 0 : Math.round((paidItems / totalItems) * 100);
        document.getElementById('progress-bar').style.width = percent + "%";
        document.getElementById('progress-text').innerText = `${percent}% de tus pagos fijos completados`;

        // Listas
        renderPayments(data);
        renderSimpleList('services-list', data.services, true);
        renderSimpleList('expenses-list', data.expenses, false);
        renderCards();
    }

    function renderPayments(data) {
        const list = document.getElementById('q-list');
        list.innerHTML = '';
        data.services.sort((a,b) => a.day - b.day).forEach(s => {
            const paid = data.payments[s.id];
            list.innerHTML += `
                <div style="display:flex; align-items:center; padding: 10px 0; border-bottom: 1px solid #eee;">
                    <button onclick="togglePayment(${s.id})" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">${paid ? '✅' : '⬜'}</button>
                    <div style="margin-left:10px">
                        <div style="${paid ? 'text-decoration:line-through; color:#888' : 'font-weight:bold'}">${s.name}</div>
                        <div style="font-size:0.7rem; color:#888">Día ${s.day} • Card: *${s.card}</div>
                    </div>
                    <div style="margin-left:auto; font-weight:bold;">${fmt.format(s.amt)}</div>
                </div>
            `;
        });
    }

    function renderSimpleList(id, arr, isServ) {
        const el = document.getElementById(id);
        el.innerHTML = '';
        arr.forEach(item => {
            el.innerHTML += `<div style="padding:8px; border-bottom:1px solid #eee; font-size:0.9rem;">
                ${isServ ? `<b>Día ${item.day}</b> - ` : ''} ${item.name || item.desc} : <b>${fmt.format(item.amt)}</b> 
                <span style="font-size:0.7rem; color:var(--primary)">(*${item.card})</span>
            </div>`;
        });
    }

    function renderCards() {
        const el = document.getElementById('cards-list');
        el.innerHTML = '';
        db.cards.forEach(c => {
            el.innerHTML += `<div style="padding:10px; background:#f9f9f9; border-radius:8px; margin-top:5px;">💳 ${c.name} - Finaliza en: <b>${c.digits}</b></div>`;
        });
    }
</script>
</body>
</html>
